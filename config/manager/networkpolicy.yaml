apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-control-plane-default-deny
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-control-plane-allow-egress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-control-plane
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 4566
        - protocol: TCP
          port: 18080
