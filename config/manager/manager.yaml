apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-control-plane
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-control-plane
    spec:
      serviceAccountName: platform-control-plane
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-control-plane
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: platform-control-plane
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: platform-control-plane:phase12-local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: platform-control-plane-metrics
  namespace: platform-system
spec:
  selector:
    app.kubernetes.io/name: platform-control-plane
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-control-plane
  namespace: platform-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-control-plane
